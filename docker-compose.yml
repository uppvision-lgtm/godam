services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE:-instagram-automation-backend:local}
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      LIVE_HEADLESS: "true"
      COMMENT_STATE_DIR: /data/comment-state
      DEBUG: ${DEBUG:-false}
      FRONTEND_URL: ${FRONTEND_URL:-https://auto-comment.tech,https://www.auto-comment.tech}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RATE_LIMIT_PER_IP_PER_DAY: ${RATE_LIMIT_PER_IP_PER_DAY:-10}
      PLAYWRIGHT_TIMEOUT_MS: ${PLAYWRIGHT_TIMEOUT_MS:-10000}
      PLAYWRIGHT_NAVIGATION_TIMEOUT_MS: ${PLAYWRIGHT_NAVIGATION_TIMEOUT_MS:-30000}
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-1}
    volumes:
      - comment-state:/data/comment-state
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 40s

  frontend:
    image: ${FRONTEND_IMAGE:-instagram-automation-frontend:local}
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_API_URL: http://backend:8000
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "${APP_PORT:-80}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  redis-data:
  comment-state:
